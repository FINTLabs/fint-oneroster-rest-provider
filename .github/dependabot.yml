version: 2
registries:
  fintlabs:
    type: maven-repository
    url: https://repo.fintlabs.no/releases
updates:
  - package-ecosystem: "gradle"
    registries:
      - fintlabs
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springdoc*"
          - "io.spring.gradle:*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      fint-novari:
        patterns:
          - "no.fint:*"
          - "no.fintlabs:*"
          - "no.novari:*"
      gradle-plugins:
        patterns:
          - "com.github.ben-manes.versions"
          - "se.patrikerdes.use-latest-versions"
          - "org.jlleitschuh.gradle:*"
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
      gradle-other-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
